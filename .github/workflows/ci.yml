name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Verify publish config
        run: node scripts/check-publish-config.mjs

      - name: Type check
        run: npm run typecheck

      - name: Bundle build
        run: npm run build

      - name: Lint workflow files
        run: node -e "console.log('ok')"
